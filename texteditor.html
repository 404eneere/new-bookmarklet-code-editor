<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bookmarklet Code Editor</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: Arial, Helvetica, sans-serif;
    background: #111827;
    color: #f9fafb;
}

body {
    display: flex;
    flex-direction: column;
}

header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    padding: 14px 18px;
    background: #1f2937;
    border-bottom: 1px solid #374151;
}

header h1 {
    margin: 0;
    font-size: 18px;
}

.toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

button {
    appearance: none;
    border: 1px solid #4b5563;
    border-radius: 6px;
    padding: 8px 13px;
    background: #374151;
    color: white;
    cursor: pointer;
    font-size: 14px;
    transition: background .15s, transform .05s;
}

button:hover {
    background: #4b5563;
}

button:active {
    transform: scale(.97);
}

button.primary {
    background: #2563eb;
    border-color: #2563eb;
}

button.primary:hover {
    background: #1d4ed8;
}

button.danger {
    background: #dc2626;
    border-color: #dc2626;
}

button.danger:hover {
    background: #b91c1c;
}

main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
    padding: 15px;
    gap: 12px;
}

.editor-wrapper {
    flex: 1;
    min-height: 0;
    position: relative;
}

#editor {
    width: 100%;
    height: 100%;
    min-height: 400px;
    resize: none;
    display: block;

    padding: 15px;

    border: 1px solid #374151;
    border-radius: 8px;

    outline: none;

    background: #030712;
    color: #e5e7eb;

    font-family:
        "Cascadia Code",
        "SFMono-Regular",
        Consolas,
        "Liberation Mono",
        monospace;

    font-size: 14px;
    line-height: 1.55;

    tab-size: 2;
}

#editor:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 2px rgba(37, 99, 235, .2);
}

.status {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 8px 11px;
    border-radius: 6px;
    background: #1f2937;
    color: #9ca3af;
    font-size: 13px;
}

#message {
    min-height: 20px;
}

footer {
    padding: 9px 15px;
    text-align: center;
    color: #6b7280;
    font-size: 12px;
}

/* Mobile */

@media (max-width: 700px) {
    header {
        align-items: flex-start;
        flex-direction: column;
    }

    .toolbar {
        width: 100%;
    }

    .toolbar button {
        flex: 1;
    }

    #editor {
        min-height: 350px;
    }
}
</style>
</head>

<body>

<header>
    <h1>Bookmarklet Code Editor</h1>

    <div class="toolbar">
        <button id="runBtn" class="primary">▶ Run</button>
        <button id="copyBtn">Copy</button>
        <button id="bookmarkletBtn">Bookmarklet</button>
        <button id="clearBtn" class="danger">Clear</button>
    </div>
</header>

<main>

    <div class="editor-wrapper">
        <textarea
            id="editor"
            spellcheck="false"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            placeholder="Enter JavaScript here..."
        ></textarea>
    </div>

    <div class="status">
        <span id="message">Ready</span>
        <span id="counter">0 characters</span>
    </div>

</main>

<footer>
    JavaScript Bookmarklet Editor
</footer>


<script>
"use strict";

/* --------------------------------------------------
   Elements
-------------------------------------------------- */

const editor = document.getElementById("editor");
const runBtn = document.getElementById("runBtn");
const copyBtn = document.getElementById("copyBtn");
const bookmarkletBtn = document.getElementById("bookmarkletBtn");
const clearBtn = document.getElementById("clearBtn");
const message = document.getElementById("message");
const counter = document.getElementById("counter");


/* --------------------------------------------------
   Default code
-------------------------------------------------- */

const DEFAULT_CODE = `javascript:(()=>{

    alert("Bookmarklet works!");

})();`;


/* --------------------------------------------------
   Helpers
-------------------------------------------------- */

function setMessage(text, error = false) {
    message.textContent = text;
    message.style.color = error ? "#f87171" : "#9ca3af";
}

function updateCounter() {
    const length = editor.value.length;

    counter.textContent =
        length === 1
            ? "1 character"
            : length + " characters";
}

function getCode() {
    return editor.value.trim();
}


/* --------------------------------------------------
   Local storage
-------------------------------------------------- */

function saveCode() {
    try {
        localStorage.setItem(
            "bookmarklet-editor-code",
            editor.value
        );
    } catch (error) {
        console.warn("Could not save code:", error);
    }
}

function loadCode() {
    try {
        const saved = localStorage.getItem(
            "bookmarklet-editor-code"
        );

        if (saved !== null) {
            editor.value = saved;
        } else {
            editor.value = DEFAULT_CODE;
        }
    } catch (error) {
        editor.value = DEFAULT_CODE;
    }

    updateCounter();
}


/* --------------------------------------------------
   Copy
-------------------------------------------------- */

async function copyText(text) {

    if (!text) {
        setMessage("Nothing to copy.", true);
        return;
    }

    try {

        await navigator.clipboard.writeText(text);

        setMessage("Copied!");

    } catch (error) {

        /* Fallback for browsers that block clipboard API */

        const temporary = document.createElement("textarea");

        temporary.value = text;
        temporary.style.position = "fixed";
        temporary.style.left = "-9999px";

        document.body.appendChild(temporary);

        temporary.focus();
        temporary.select();

        try {
            document.execCommand("copy");
            setMessage("Copied!");
        } catch (copyError) {
            setMessage("Copy failed. Select the code manually.", true);
        }

        temporary.remove();
    }
}


/* --------------------------------------------------
   Convert JavaScript into bookmarklet
-------------------------------------------------- */

function makeBookmarklet(code) {

    code = code.trim();

    if (!code) {
        return "";
    }

    /*
       If the user already entered javascript:
       remove it so we don't create:

       javascript:javascript:...
    */

    if (code.toLowerCase().startsWith("javascript:")) {
        code = code.slice("javascript:".length);
    }

    /*
       Encode line breaks and tabs.

       encodeURIComponent is intentionally NOT used
       because bookmarklets need executable JavaScript.
    */

    code = code
        .replace(/[\r\n]+/g, " ")
        .replace(/\s{2,}/g, " ");

    return "javascript:" + code;
}


/* --------------------------------------------------
   Run code
-------------------------------------------------- */

function runCode() {

    const code = getCode();

    if (!code) {
        setMessage("Nothing to run.", true);
        return;
    }

    try {

        let executable = code;

        if (executable
            .toLowerCase()
            .startsWith("javascript:")) {

            executable =
                executable.slice("javascript:".length);
        }

        /*
           Run inside the current page.

           Function() avoids issues caused by eval
           scope while still allowing normal JavaScript.
        */

        const fn = new Function(executable);

        fn();

        setMessage("Code executed.");

    } catch (error) {

        console.error(error);

        setMessage(
            "Error: " + error.message,
            true
        );

    }
}


/* --------------------------------------------------
   Generate bookmarklet
-------------------------------------------------- */

function generateBookmarklet() {

    const code = getCode();

    if (!code) {
        setMessage("Nothing to convert.", true);
        return;
    }

    const bookmarklet = makeBookmarklet(code);

    copyText(bookmarklet);

    setMessage("Bookmarklet copied!");
}


/* --------------------------------------------------
   Clear
-------------------------------------------------- */

function clearEditor() {

    if (!editor.value.trim()) {
        return;
    }

    const confirmed = confirm(
        "Clear the editor?"
    );

    if (!confirmed) {
        return;
    }

    editor.value = "";

    saveCode();
    updateCounter();

    setMessage("Editor cleared.");
}


/* --------------------------------------------------
   Events
-------------------------------------------------- */

runBtn.addEventListener("click", function(event) {
    event.preventDefault();
    runCode();
});

copyBtn.addEventListener("click", function(event) {
    event.preventDefault();
    copyText(getCode());
});

bookmarkletBtn.addEventListener("click", function(event) {
    event.preventDefault();
    generateBookmarklet();
});

clearBtn.addEventListener("click", function(event) {
    event.preventDefault();
    clearEditor();
});

editor.addEventListener("input", function() {
    updateCounter();
    saveCode();
});


/* --------------------------------------------------
   Keyboard shortcuts
-------------------------------------------------- */

editor.addEventListener("keydown", function(event) {

    /*
       Tab inserts spaces instead of leaving the editor.
    */

    if (event.key === "Tab") {

        event.preventDefault();

        const start = editor.selectionStart;
        const end = editor.selectionEnd;

        editor.value =
            editor.value.substring(0, start) +
            "  " +
            editor.value.substring(end);

        editor.selectionStart =
            editor.selectionEnd =
                start + 2;

        updateCounter();
        saveCode();
    }


    /*
       Ctrl+Enter / Cmd+Enter = Run
    */

    if (
        event.key === "Enter" &&
        (event.ctrlKey || event.metaKey)
    ) {

        event.preventDefault();

        runCode();
    }

});


/* --------------------------------------------------
   Start
-------------------------------------------------- */

loadCode();

setMessage("Ready");

console.log(
    "Bookmarklet Code Editor loaded successfully."
);

</script>

</body>
</html>
